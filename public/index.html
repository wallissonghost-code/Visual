<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Visual QA</title><link rel="stylesheet" href="/style.css"></head><body><main><header><span class="logo">V</span><div><h1>VISUAL</h1><p>Automated Quality & Security Inspector · <span id="visualVersion">carregando versão…</span></p></div><span class="live">● ONLINE</span></header><nav class="profiles"><button class="profile active" data-profile="visual">◫ Visual</button><button class="profile" data-profile="security">◇ Segurança / Assinatura</button><button class="profile" type="button" onclick="location.href='/limpo.html'">L LIMPO / Auth</button></nav><section class="hero"><h2 id="heroTitle">Encontre bugs visuais antes do usuário.</h2><p id="heroText">Analise código ou uma página real em busca de estados presos, problemas touch, viewport, foco e erros de interface.</p></section><section class="card"><label>ALVO DA ANÁLISE</label><input id="target" placeholder="https://github.com/owner/projeto.git"><div class="modes"><button class="mode active" data-mode="repo">Código / Repositório</button><button class="mode" data-mode="url">Página / URL pública</button></div><button id="run" class="run">INICIAR ANÁLISE</button></section><section id="status" class="status hidden"><div class="scan"><span></span></div><h3 id="state">Preparando bots…</h3><p id="detail"></p></section><section id="result" class="result hidden"><div class="resultHead"><h3>Relatório</h3><div><button id="share" class="copy" title="Compartilhar relatório JSON" aria-label="Compartilhar relatório JSON"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M5 11v7.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V11"/></svg></button><span id="badge">CONCLU
