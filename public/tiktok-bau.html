<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TikTok Baú · Visual</title>
<link rel="stylesheet" href="/style.css">
<style>
.chest-grid{display:grid;gap:12px;margin-top:16px}.diag{display:grid;gap:8px}.diag-row{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.025)}.diag-row b{font-size:13px}.diag-row span{font-size:13px;text-align:right}.bau-result{margin-top:14px;padding:16px;border-radius:14px;border:1px solid rgba(255,255,255,.1)}.bau-result h3{margin:0 0 6px}.muted{opacity:.7;font-size:13px}.profiles{overflow-x:auto}.profiles .profile{white-space:nowrap}.evidence{max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:11px;opacity:.78}
</style>
</head>
<body><main>
<header><span class="logo">V</span><div><h1>TIKTOK BAÚ</h1><p>Detector experimental de LIVE e recompensa pública</p></div><span class="live">● BETA</span></header>
<nav class="profiles" aria-label="Módulos">
<button class="profile" onclick="location.href='/'">Visual</button>
<button class="profile" onclick="location.href='/security-model.html'">Segurança</button>
<button class="profile" onclick="location.href='/limpo.html'">LIMPO / Auth</button>
<button class="profile" onclick="location.href='/network-map.html'">Mapa de URL</button>
<button class="profile" onclick="location.href='/tiktok-compare.html'">TikTok Compare</button>
<button class="profile active">TikTok Baú</button>
</nav>
<section class="hero"><h2>Verifique uma LIVE do TikTok.</h2><p>Informe o @ do perfil ou a URL. O Visual tenta abrir a rota pública /live e procura sinais públicos de LIVE e baú/recompensa.</p></section>
<section class="card">
<label>PERFIL DO TIKTOK</label>
<input id="target" autocomplete="off" autocapitalize="off" placeholder="@usuario ou https://www.tiktok.com/@usuario">
<button id="run" class="run">VERIFICAR LIVE / BAÚ</button><button id="discover" class="run" style="margin-top:10px">🔎 DESCOBRIR LIVES</button><div id="feedBox" class="chest-grid"></div>
</section>
<section id="status" class="status hidden"><div class="scan"><span></span></div><h3 id="state">Preparando verificação…</h3><p id="detail"></p></section>
<section id="result" class="result hidden">
<div class="resultHead"><h3>Diagnóstico</h3><span id="badge">CONCLUÍDO</span></div>
<div class="chest-grid"><div class="diag" id="diag"></div><div id="bauResult" class="bau-result"></div><details><summary>Evidência técnica</summary><pre id="evidence" class="evidence"></pre></details></div>
</section>
</main>
<script>
let lastDiscoveryDiagnostic='';const $=id=>document.getElementById(id), run=$('run'), discover=$('discover'), feedBox=$('feedBox'), target=$('target'), status=$('status'), result=$('result'), state=$('state'), detail=$('detail'), diag=$('diag'), bau=$('bauResult'), evidence=$('evidence');
function usernameOf(v){v=String(v||'').trim();const m=v.match(/tiktok\.com\/@([^/?#]+)/i);if(m)return decodeURIComponent(m[1]);return v.replace(/^@/,'').replace(/[/?#].*$/,'').trim()}
function row(name,value,ok){return '<div class="diag-row"><b>'+name+'</b><span>'+(ok===true?'✅ ':ok===false?'❌ ':'⚪ ')+value+'</span></div>'}
function flatten(v,out=[],depth=0){if(depth>9||v==null)return out;if(typeof v==='string'){out.push(v);return out}if(typeof v==='number'||typeof v==='boolean'){out.push(String(v));return out}if(Array.isArray(v)){for(const x of v)flatten(x,out,depth+1);return out}if(typeof v==='object'){for(const [k,x] of Object.entries(v)){out.push(k);flatten(x,out,depth+1)}}return out}
discover.onclick=async()=>{discover.disabled=true;discover.textContent='BUSCANDO LIVES…';feedBox.innerHTML='<p class="muted">Consultando o feed público recomendado…</p>';try{const r=await fetch('/api/tiktok/live-feed?limit=30&pages=3',{headers:{accept:'application/json'}});const raw=await r.text();let d=null;try{d=JSON.parse(raw)}catch{const ct=r.headers.get('content-type')||'desconhecido';throw new Error('Resposta não-JSON · HTTP '+r.status+' · '+ct+' · '+raw.slice(0,240).replace(/\\s+/g,' '))}if(!r.ok)throw new Error(d?.error||('HTTP '+r.status));if(!d.rooms?.length){lastDiscoveryDiagnostic=JSON.stringify({source:d.source,feed:d.attempts,browserFallback:d.browserFallback},null,2);feedBox.innerHTML='<div class="bau-result"><h3>🟡 Nenhuma LIVE descoberta</h3><p class="muted">'+(d.note||'O feed não retornou salas.')+'</p><button id="copyDiscovery" class="run" style="margin:8px 0">📋 COPIAR DIAGNÓSTICO</button><pre class="evidence">'+lastDiscoveryDiagnostic.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</pre></div>';const cb=$('copyDiscovery');if(cb)cb.onclick=async()=>{try{await navigator.clipboard.writeText(lastDiscoveryDiagnostic);cb.textContent='✅ COPIADO';setTimeout(()=>cb.textContent='📋 COPIAR DIAGNÓSTICO',1600)}catch{cb.textContent='❌ NÃO COPIOU'}};return}feedBox.innerHTML='<div class="bau-result"><h3>🔎 '+d.rooms.length+' LIVEs descobertas</h3><p class="muted">Clique em uma para carregar o @ no detector.</p></div>'+d.rooms.map(x=>'<button class="profile feed-live" data-user="'+(x.username||'')+'" style="text-align:left;width:100%;padding:12px"><b>'+(x.username?'@'+x.username:'room '+x.roomId)+'</b><br><span class="muted">'+(x.viewers!=null?x.viewers+' viewers · ':'')+(x.title||'LIVE')+'</span></button>').join('');feedBox.querySelectorAll('.feed-live').forEach(b=>b.onclick=()=>{if(b.dataset.user){target.value='@'+b.dataset.user;target.scrollIntoView({behavior:'smooth',block:'center'})}})}catch(e){feedBox.innerHTML='<div class="bau-result"><h3>❌ Falha na descoberta</h3><p class="muted">'+String(e.message||e)+'</p></div>'}finally{discover.disabled=false;discover.textContent='🔎 DESCOBRIR LIVES'}};
run.onclick=async()=>{
 const user=usernameOf(target.value);if(!/^[A-Za-z0-9._-]{2,32}$/.test(user)){alert('Informe um @ válido ou URL de perfil do TikTok.');return}
 const liveUrl='https://www.tiktok.com/@'+user+'/live';run.disabled=true;status.classList.remove('hidden');result.classList.add('hidden');state.textContent='Abrindo @'+user+'…';detail.textContent='Conectando ao Webcast da LIVE e observando eventos de baú por 5 segundos.';
 try{
  const r=await fetch('/api/tiktok/treasure-watch?username='+encodeURIComponent(user)+'&observeMs=5000');
  const data=await r.json();if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
  const profileSeen=!!user;
  const offline=!data.connected||data.live===false;
  const liveDetected=!!data.connected&&data.live!==false;
  const rewardHits=Array.isArray(data.envelopes)?data.envelopes:[];
  const chestDetected=!!data.treasureDetected;
  diag.innerHTML=row('Perfil',profileSeen?'@'+user+' encontrado':'@'+user+' não confirmado',profileSeen)+row('Rota LIVE',liveDetected?'sinais de LIVE encontrados':offline?'perfil parece OFFLINE':'resultado inconclusivo',liveDetected?true:offline?false:null)+row('Webcast',data.connected?'conectado':'não conectado',data.connected?true:false)+row('Baú / recompensa',chestDetected?'NOVO baú detectado':liveDetected?'nenhum novo evento em 5s':'não verificável',chestDetected?true:liveDetected?null:false);
  bau.innerHTML=chestDetected?'<h3>🎁 BAÚ DETECTADO</h3><p class="muted">'+rewardHits.map(x=>(x.diamondCount||0)+' moedas/diamantes · abre em '+(x.opensInSeconds??'?')+'s · '+(x.sendUserName||'remetente não informado')).join('<br>')+'</p>':liveDetected?'<h3>🔴 LIVE conectada · nenhum NOVO baú em 5s</h3><p class="muted">O Webcast foi conectado, mas nenhum WebcastEnvelopeMessage novo chegou durante a janela. Um baú lançado antes da conexão pode não ser reenviado.</p>':offline?'<h3>⚫ PERFIL OFFLINE</h3><p class="muted">Não há LIVE ativa para verificar agora.</p>':'<h3>🟡 RESULTADO INCONCLUSIVO</h3><p class="muted">O TikTok não expôs sinais suficientes nesta tentativa. Isso não prova que não exista LIVE ou baú.</p>';
  evidence.textContent=JSON.stringify({username:user,liveUrl,profileSeen,offline,liveDetected,rewardHits,chestDetected,webcast:data},null,2);
  result.classList.remove('hidden');state.textContent='Verificação concluída';detail.textContent='A observação usa o evento WebcastEnvelopeMessage. Ausência de evento durante 5s não prova que não exista um baú criado antes da conexão.';
 }catch(e){state.textContent='Falha na verificação';detail.textContent=String(e.message||e);diag.innerHTML=row('Verificação','falhou',false);bau.innerHTML='<h3>Não foi possível concluir</h3><p class="muted">'+String(e.message||e)+'</p>';evidence.textContent=String(e.stack||e);result.classList.remove('hidden')}
 finally{run.disabled=false}
};
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
</script>
</body></html>
